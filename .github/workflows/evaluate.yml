name: Evaluate

# Scores the extractor against hand-verified values (evals/golden.json). Nothing is written to production.
on:
  workflow_dispatch:
    inputs:
      quarters:
        description: Quarters of history to read
        required: true
        default: "6"
        type: string
      second_reader:
        description: Second reader when Flash's reading cannot stand alone
        required: true
        default: pro
        type: choice
        options:
          - pro
          - flash-thinking
  # Weekly, and whenever the prompts or the reader change.
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: [main]
    paths:
      - kpi_extractor/ai.py
      - kpi_extractor/extract.py

permissions:
  contents: read
  id-token: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BUSINESS_KPI_WORKFLOW_URL: https://uyctfctddoknjchvtmyy.supabase.co/functions/v1/business-kpi-workflow
      SEC_USER_AGENT: TradeTracker admin@inferentica.com
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv pip install .
      - name: Score against the golden set
        env:
          QUARTERS: ${{ inputs.quarters || '6' }}
          KPI_SECOND_READER: ${{ inputs.second_reader || 'pro' }}
        run: python -m kpi_extractor.evaluate --quarters "$QUARTERS"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evaluation-${{ github.run_id }}
          path: eval-results
          if-no-files-found: ignore
          retention-days: 30
