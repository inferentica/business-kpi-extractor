name: Evaluate

# Scores the extractor against hand-verified values (evals/golden.json). Nothing is written to production.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: What to score - the golden set (whole pipeline) or each prompt on its own (evals/prompts.json)
        required: true
        default: golden
        type: choice
        options:
          - golden
          - prompts
          - trial
          - classify
          - code-reads
      symbols:
        description: For a trial - comma-separated tickers to read as new companies (nothing is stored); for code-reads, the companies whose releases code reads again with no AI
        required: false
        type: string
      quarters:
        description: Quarters of history to read
        required: true
        default: "6"
        type: string
      ai_profile:
        description: Reasoning effort - flash-high (production), flash-low, flash-max, reasoning on every call (flash-max-all), Qianwen for every call (qwen), or DeepSeek's first reading with Qianwen's reasoning calls (mixed)
        required: true
        default: flash-high
        type: choice
        options:
          - flash-high
          - flash-low
          - flash-max
          - flash-max-all
          - qwen
          - mixed
      golden:
        description: Values to score against; its companies are the ones read
        required: true
        default: evals/golden.json
        type: string
      lists_from:
        description: For a trial - an earlier Evaluate run's id whose KPI lists to reuse, so the rerun measures the readers alone
        required: false
        type: string
      offpeak:
        description: Wait for DeepSeek's off-peak hours (half price) before reading
        required: false
        default: true
        type: boolean
      lists:
        description: KPI lists - stored (production's, cheaper and stable) or fresh (written anew, as for a new company)
        required: true
        default: stored
        type: choice
        options:
          - stored
          - fresh
      golden_set:
        description: The golden set to score - full (every company) or quick (one company for each way of reading, about a third of the cost)
        required: false
        default: full
        type: choice
        options:
          - full
          - quick
      platform:
        description: Where the golden set runs - x64 on the runner itself, or arm64 inside the worker image (Dockerfile), as on Oracle's ARM machines
        required: false
        default: x64
        type: choice
        options:
          - x64
          - arm64-image
  # Weekly with fresh lists, and with stored lists whenever the prompts or the reader change.
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: [main]
    paths:
      # What ai.py and extract.py held before the restructure: the prompts and schemas, the reading rules, the reader.
      - kpi_extractor/ai/**
      - kpi_extractor/rules/**
      - kpi_extractor/readers/extract.py
      # Where filings come from: listing, downloads and XBRL, behind the source adapter.
      - kpi_extractor/sources/**

permissions:
  contents: read
  actions: read     # to fetch an earlier run's lists (lists_from)
  id-token: write

# A push scores the quick set, and a newer push replaces a run still going: only the latest code needs scoring. Runs
# started by hand or by the schedule are never cancelled.
concurrency:
  group: ${{ github.event_name == 'push' && 'evaluate-push' || format('evaluate-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  evaluate:
    if: inputs.platform != 'arm64-image'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BUSINESS_KPI_WORKFLOW_URL: ${{ vars.BUSINESS_KPI_WORKFLOW_URL || 'https://uyctfctddoknjchvtmyy.supabase.co/functions/v1/business-kpi-workflow' }}
      SEC_USER_AGENT: TradeTracker admin@inferentica.com
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv pip install .
      - name: Wait for DeepSeek off-peak prices
        # a push or the schedule waits too (an unset input equals false); code reads make no AI call, so never wait
        if: (github.event_name != 'workflow_dispatch' || inputs.offpeak) && inputs.suite != 'code-reads'
        run: python -m kpi_extractor.ops.offpeak
      - name: Read releases with code alone (no AI)
        if: inputs.suite == 'code-reads'
        env:
          SYMBOLS: ${{ inputs.symbols }}
          QUARTERS: ${{ inputs.quarters || '12' }}
        # Each release as it arrives (from the quarter before it), then as a backfill (from the quarter a year earlier).
        run: |
          status=0
          python -m kpi_extractor.evals.code_reads --symbols "$SYMBOLS" --quarters "$QUARTERS" --order arrival || status=1
          python -m kpi_extractor.evals.code_reads --symbols "$SYMBOLS" --quarters "$QUARTERS" --order backfill || status=1
          exit $status
      - name: Score the Classify rules (no AI)
        if: inputs.suite == 'classify'
        run: python -m kpi_extractor.evals.classify_eval
      - name: Score each prompt
        if: inputs.suite == 'prompts'
        env:
          KPI_AI_PROFILE: ${{ inputs.ai_profile || 'flash-high' }}
        run: python -m kpi_extractor.evals.prompt_eval
      - name: Fetch the lists to reuse
        if: inputs.suite == 'trial' && inputs.lists_from != ''
        env:
          GH_TOKEN: ${{ github.token }}
          LISTS_FROM: ${{ inputs.lists_from }}
        run: gh run download "$LISTS_FROM" --repo "$GITHUB_REPOSITORY" --dir lists-from
      - name: Read new companies (trial)
        if: inputs.suite == 'trial'
        env:
          KPI_AI_PROFILE: ${{ inputs.ai_profile || 'flash-high' }}
          SYMBOLS: ${{ inputs.symbols }}
          QUARTERS: ${{ inputs.quarters || '4' }}
          LISTS_FROM: ${{ inputs.lists_from }}
        run: |
          LISTS=""
          if [ -n "$LISTS_FROM" ]; then LISTS="--lists-from $(find lists-from -name trial.json | head -1)"; fi
          python -m kpi_extractor.evals.trial --symbols "$SYMBOLS" --quarters "$QUARTERS" $LISTS
      - name: Score against the golden set
        if: inputs.suite != 'prompts' && inputs.suite != 'trial' && inputs.suite != 'classify' && inputs.suite != 'code-reads'
        env:
          QUARTERS: ${{ inputs.quarters || '6' }}
          KPI_EVAL_LISTS: ${{ inputs.lists || (github.event_name == 'schedule' && 'fresh' || 'stored') }}
          KPI_AI_PROFILE: ${{ inputs.ai_profile || 'flash-high' }}
          GOLDEN: ${{ inputs.golden || 'evals/golden.json' }}
          QUICK: ${{ (inputs.golden_set == 'quick' || github.event_name == 'push') && '--quick' || '' }}
        run: python -m kpi_extractor.evals.evaluate --quarters "$QUARTERS" --golden "$GOLDEN" $QUICK
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evaluation-${{ github.run_id }}
          path: eval-results
          if-no-files-found: ignore
          retention-days: 30

  # The golden set inside the worker image on an ARM runner: what Oracle's Ampere workers would run, with its peak memory
  # and a real OCR read (the chart tests use recorded OCR words).
  evaluate-image:
    if: inputs.platform == 'arm64-image'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - name: Build the worker image (its tests run in the build)
        run: docker build --tag extractor .
      - name: Read a rendered chart label with OCR
        run: |
          docker run --rm extractor python -c "
          import time
          from PIL import Image, ImageDraw, ImageFont
          from rapidocr_onnxruntime import RapidOCR
          image = Image.new('RGB', (900, 220), 'white')
          ImageDraw.Draw(image).text((30, 60), 'Systems sold 1,234 units', fill='black', font=ImageFont.load_default(size=64))
          image.save('/tmp/chart.png')
          start = time.time()
          result, _ = RapidOCR()('/tmp/chart.png')
          words = ' '.join(item[1] for item in result or [])
          print(f'OCR read {words!r} in {time.time() - start:.1f} s')
          assert '1,234' in words.replace(' ', '') or '1234' in words.replace(',', ''), words
          "
      - name: Wait for DeepSeek off-peak prices
        if: github.event_name != 'workflow_dispatch' || inputs.offpeak  # a push or the schedule waits too (an unset input equals false)
        run: docker run --rm extractor python -m kpi_extractor.ops.offpeak
      - name: Score against the golden set
        env:
          QUARTERS: ${{ inputs.quarters || '6' }}
          KPI_EVAL_LISTS: ${{ inputs.lists || 'stored' }}
          KPI_AI_PROFILE: ${{ inputs.ai_profile || 'flash-high' }}
          GOLDEN: ${{ inputs.golden || 'evals/golden.json' }}
          BUSINESS_KPI_WORKFLOW_URL: ${{ vars.BUSINESS_KPI_WORKFLOW_URL || 'https://uyctfctddoknjchvtmyy.supabase.co/functions/v1/business-kpi-workflow' }}
        # The job's own OIDC request variables let the container sign in to the control plane as this workflow.
        run: |
          mkdir -p eval-results && chmod 777 eval-results
          docker run --rm -v "$PWD/eval-results:/app/eval-results" \
            -e ACTIONS_ID_TOKEN_REQUEST_URL -e ACTIONS_ID_TOKEN_REQUEST_TOKEN -e BUSINESS_KPI_WORKFLOW_URL \
            -e KPI_EVAL_LISTS -e KPI_AI_PROFILE \
            extractor /usr/bin/time -v python -m kpi_extractor.evals.evaluate --quarters "$QUARTERS" --golden "$GOLDEN"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evaluation-${{ github.run_id }}
          path: eval-results
          if-no-files-found: ignore
          retention-days: 30
