# One-off probe: Chile's CMF (IFRS statements of SQM and the other US-listed Chilean filers) and Mexico's BMV, from a worker.
name: latam-probe
on:
  push:
    branches: [statements/latam-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Reach CMF and BMV and list statement downloads
        shell: python
        run: |
          import os, re, html, urllib.request
          agent = {"User-Agent": "TradeTracker statements (admin@inferentica.com)"}
          os.makedirs("out", exist_ok=True)
          def get(url, name):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=agent), timeout=90) as r:
                      body = r.read(); open(f"out/{name}", "wb").write(body)
                      print(name, r.status, len(body), r.headers.get("content-type")); return body.decode("latin-1", "replace")
              except Exception as e:
                  print(name, "ERROR", type(e).__name__, str(e)[:200]); return ""
          import urllib.parse
          base = "https://www.cmfchile.cl/institucional/mercados/entidad.php?mercado=V&rut={rut}&grupo=&tipoentidad=RVEMI&row=&vig=VI&control=svs&pestania=3"
          for rut, mm, aa in (("93007000", "09", "2025"), ("93007000", "12", "2012"), ("93007000", "03", "2008")):
              data = urllib.parse.urlencode({"forma": "P", "mm": mm, "aa": aa, "tipo": "C", "tipo_norma": "IFRS"}).encode()
              request = urllib.request.Request(base.format(rut=rut), data=data, headers=agent)
              try:
                  with urllib.request.urlopen(request, timeout=90) as r:
                      body = r.read(); open(f"out/cmf_{rut}_{aa}{mm}.html", "wb").write(body)
                      text = body.decode("latin-1", "replace")
                      print(rut, aa, mm, r.status, len(body))
                      for m in sorted(set(re.findall(r'(?:href|onclick|src)="([^"]+)"', text))):
                          if any(w in m.lower() for w in ("xbrl", "zip", "pdf", "archivo", "ventana", "txt")): print("   ", html.unescape(m)[:240])
              except Exception as e:
                  print(rut, aa, mm, "ERROR", type(e).__name__, str(e)[:200])
      - uses: actions/upload-artifact@v6
        with:
          name: latam-probe
          path: out/
