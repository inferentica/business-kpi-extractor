[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "business-kpi-extractor"
version = "1.0.0"
description = "Reads business segments and operating KPIs from SEC filings for TradeTracker and Bedrock."
requires-python = ">=3.12"
dependencies = [
  "edgartools==5.59.1",
  "lxml==6.1.3",
  "pydantic==2.13.5"
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
business-kpi-extractor = "kpi_extractor.cli:main"
business-kpi-evaluate = "kpi_extractor.evaluate:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["kpi_extractor*"]
